name: translate

on:
  # Sent by the source repositories on a docs push:
  # gh api repos/nuxt/translations/dispatches -f event_type=source-push -f 'client_payload[sources]=nuxt-main'
  repository_dispatch:
    types: [source-push]
  workflow_dispatch:
    inputs:
      sources:
        description: Only these sources (comma separated)
        default: ''
      limit:
        description: Most segments per locale sent to the model
        default: ''
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    environment: translations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .diglot/checkouts
          key: diglot-checkouts-${{ github.run_id }}
          restore-keys: diglot-checkouts-

      - id: diglot
        uses: danielroe/diglot/packages/action@7c6694964b9effe894fae9947ae1115e2e19ce71 # v0.1.4
        with:
          sources: ${{ github.event.client_payload.sources || inputs.sources }}
          limit: ${{ inputs.limit }}
          build-dist: 'false'
          git-user-name: nuxtbot
          git-user-email: 132644279+nuxtbot@users.noreply.github.com
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - if: steps.diglot.outputs.committed == 'true'
        run: git pull --rebase origin ${{ github.ref_name }} && git push
        env:
          GIT_COMMITTER_NAME: nuxtbot
          GIT_COMMITTER_EMAIL: 132644279+nuxtbot@users.noreply.github.com
